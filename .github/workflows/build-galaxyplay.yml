name: Build GalaxyPlay APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Fetch GalaxyPlay source
        run: |
          set -euxo pipefail
          git init GalaxyPlay
          cd GalaxyPlay
          git remote add origin https://github.com/Tamshen/GalaxyPlay.git
          git fetch --depth 1 origin 115adc33f271627c0a358bafaa2f741e6de7a467
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "115adc33f271627c0a358bafaa2f741e6de7a467"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: GalaxyPlay
        run: |
          chmod +x gradlew
          ./gradlew :mobile:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp GalaxyPlay/mobile/build/outputs/apk/debug/mobile-debug.apk GalaxyPlay-0.1.67-latest.apk
          sha256sum GalaxyPlay-0.1.67-latest.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GalaxyPlay-0.1.67-latest
          path: GalaxyPlay-0.1.67-latest.apk
          if-no-files-found: error
          retention-days: 7
